# Run in the directory generated by examples/quickstart/run.py.
# Synthetic labels test the interface, not material accuracy.
trainset train.cfg
validset valid.cfg
potfile template.mtp
index index.map
fit:device cuda
fit:gpu_id 0
fit:gpu_batch_atoms 4096
fit:gpu_batch_structures 32
fit:gpu_memory_mib 256
fit:gpu_workspace_mib 64
fit:gpu_device_loss true
fit:skip_preinit true
fit:rescale_mode fixed
fit:energy_weight 1
fit:force_weight 0.1
fit:stress_weight 0.001
fit:weight_L2 1e-12
fit:penalty_weight 0
fit:bfgs_m 2
fit:bfgs_maxiteration 5
fit:epoch_limit 2
fit:batch_size 8
fit:learning_rate 0.0001
fit:save_every 100
fit:save_to checkpoint-gpu.mtp
