# Top-level trainnlpot input settings.
index index.map
trainset train.cfg
trainset-format mlpcfg

# The submission script creates this symlink inside its private run directory.
pot:potfile potential.mtp
pot:pottype mtp
pot:typemap index.map

# CUDA loss/gradient backend. For MPI one-rank-per-GPU jobs use gpu_id=-1.
fit:device cuda
fit:gpu_id 0

fit:energy_weight 1.0
fit:force_weight 0.1
fit:stress_weight 0.001
fit:energy_pow 1
fit:force_pow 0
fit:stress_pow 1

fit:weight_L1 0.0
fit:weight_L2 0.0
fit:weight_rad_w0 0.0
fit:weight_rad_w1 0.0
fit:weight_rad_w2 0.0
fit:penalty_weight 0.0

fit:bfgs_m 5
fit:bfgs_conv_tol 1e-12
fit:bfgs_grad_tol 1e-10
fit:bfgs_step_tol 1e-12
fit:bfgs_maxiteration 3
fit:save_every 100
fit:save_to fitted-gpu.mtp
