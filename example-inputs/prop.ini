# calc_prop — Calculate structural properties
# Usage: imrmlp calc_prop prop.ini
#
# ===== Input/Output =====
input               input.cfg           # [string] Input trajectory file
input-format        extxyz              # [string] Input file format
index               index.map           # [string] Index file mapping atom types to indices
cutoff              5.0                 # [real] Neighborhood cutoff radius (A)
num-types           -1                  # [int] Number of atom types (-1=auto)
settings            input.inp           # [string] Settings file

# ===== Analysis Flags =====
sro                 false               # [bool] Compute SRO parameters
rdf                 false               # [bool] Compute RDF/PCF
ha-index            false               # [bool] Compute HA indices
voro-index          false               # [bool] Compute Voronoi indices
bondangle           false               # [bool] Compute bond angle distributions
dihedral            false               # [bool] Compute dihedral angle distributions
bop                 false               # [bool] Compute bond-order parameters
c-cna               false               # [bool] Compute CNA indices
c-wcsro             false               # [bool] Compute Warren-Cowley SRO
msd                 false               # [bool] Compute MSD
vacf                false               # [bool] Compute VACF
avgpos              false               # [bool] Compute average atomic positions

# ===== Output Options =====
#output-xyz         output_traj.xyz     # [string] Output XYZ file for snapshots
output-sro          output_sro.txt      # [string] SRO analysis output
output-cna          output_cna.txt      # [string] frame atom central_type neighbor_type cna_index species_index count
# CNA also adds cna_total and cna_<index> integer columns to output-xyz.
# cna_sp_<central>_<neighbor>_<index>_<species_index> columns require cna:specie_info.
# Count-table frame/atom indices are zero-based; neighbor_type/species_index=-1 denotes the species-aggregated row.
# WCSRO writes a complete directed 2x2 matrix to output-sro, pooled across selected frames.
# If sro and c-wcsro are both enabled, WCSRO is appended as a separate section.
output-neighbor     output_neighbor.txt # [string] Neighbor info output
voro-num-print      10                  # [int] Number of Voronoi indices to output
voro-neighbor       false               # [bool] Use Voronoi neighbors for analysis
output-all-indices  false               # [bool] Output all HA/Voronoi indices

# ===== Frame Control =====
framestart          0                   # [int] Starting frame index
frameend            2147483647          # [int] Ending frame index (INT_MAX)
skip-every          1                   # [int] Skip N frames between analyses

# ===== Neighborhood =====
cutoff-inner        -1                  # [real] Inner cutoff for neighbor shell (-1=disabled)
pair-cutoff         false               # [bool] Enable type-dependent pairwise cutoff

# ===== Bond Angle Parameters =====
bondangle:sep       0.0174533           # [real] Angular bin width (radians)
bondangle:low       0.0                 # [real] Min angle (radians)
bondangle:high      3.14159             # [real] Max angle (radians, pi)
bondangle:prec      1e-5                # [real] Precision for neighbor detection
bondangle:ntypes    3                   # [int] Number of atom types

# ===== RDF Parameters =====
rdf:delta_r         0.1                 # [real] Radial bin width (A)
ref-rlimit          15.0                # [real] Max RDF radius (A)
rdf-rho-all         false               # [bool] Average density over all frames
rdf-kd              false               # [bool] Use KD-tree for RDF
rdf-no-pbc          false               # [bool] Disable PBC for RDF

# ===== SRO Parameters =====
sro:neighbor_order  1                   # [int] Neighbor shell order for SRO
sro:width           0.05                # [real] Smearing width for neighbor detection
sro:sro_type        WC                  # [string] SRO type: WC, PM, GM, WCMD (case-sensitive)

# ===== BOP (Bond Order Parameters) =====
bop:maxl            4                   # [int] Max spherical harmonic order l
bop:average         true                # [bool] Average over neighbors
bop:corase          false               # [bool] Coarse-grained BOP
bop:cutoff          5.0                 # [real] Cutoff radius (A)
bop:nnn             0                   # [int] # nearest neighbors (0=use cutoff)
bop:minnn           0                   # [int] Minimum neighbors
bop:maxnn           0                   # [int] Maximum neighbors

# ===== HA Index Parameters =====
ha_index:unbond     false               # [bool] Count unbonded pairs
ha_index:store_str  false               # [bool] Store 1 sample structure per HA index
ha_index:sample_all false               # [bool] Store all sample structures

# ===== Voronoi Index Parameters =====
voro_index:mode     RAD                 # [string] Voronoi mode: DIR, RAD
voro_index:num_edges 9                  # [int] Number of edges to display
voro_index:strip_surf_tol -0.02         # [real] Surface stripping tolerance
voro_index:strip_edge_tol -0.02         # [real] Edge stripping tolerance
voro_index:min_neighbor 0               # [int] Minimum neighbor count

# ===== CNA Parameters =====
cna:unbond          false               # [bool] Include unbonded pairs in CNA
cna:specie_info     false               # [bool] Include species information in CNA

# ===== Warren-Cowley SRO =====
wcsro:r_inn         1.0                 # [real] Inner radius (A); omitted/-1 uses cutoff-inner
wcsro:r_out         3.0                 # [real] Outer radius (A); omitted/-1 uses cutoff
wcsro:sro_type      WC                  # [string] Implemented definitions: WC or PM (case-sensitive)
# Require exactly two actual species and neighbors around both. Types are remapped internally;
# output retains original type IDs. Shell bounds are strict: r_inn < r < r_out.
# WC = 1 - P(neighbor j | central i)/c_j; asymmetric coordination can give WC_ij != WC_ji.

# ===== MSD Parameters =====
msd:timestep        1.0                 # [real] Raw-frame timestep (ps); --skip-every is applied automatically
msd:fft             true                # [bool] Use FFT algorithm
msd:drift_cm        true                # [bool] Remove COM drift
msd:drift_vm        false               # [bool] Remove integrated COM-velocity drift (mutually exclusive with drift_cm)
msd:tacavg          true                # [bool] Time-averaged correlation
msd:projection      false               # [bool] Project along direction
msd:total           true                # [bool] Compute total MSD
msd:types           false               # [bool] Compute per-type MSD
msd:track           false               # [bool] Track specific atoms
msd:groups          false               # [bool] Compute per-group MSD
msd:der             false               # [bool] Compute diffusion derivative
msd:smooth          false               # [bool] Spline smoothing
msd:reg             0.01                # [real] Smoothing regularization
msd:bsize           4                   # [int] Spline basis size
msd:max_length      -1                  # [int] Maximum number of lag samples (-1=all frames)
msd:do_lfit         false               # [bool] Fit D; requires an explicit valid fit window
msd:fit_start       0                   # [real] Linear fit start time (ps)
msd:fit_end         0                   # [real] Linear fit end time (ps)
msd:fsc_mode        0                   # [int] Finite-size correction: 0=none, 1=Yeh-Hummer
msd:temperature     300.0               # [real] Temperature (K) for FSC
msd:viscosity       0.0                 # [real] Shear viscosity (mPa*s) for FSC
msd:fsc_xi          2.837298            # [real] Hydrodynamic shape factor
msd:trackid         TRACKID             # [string] Track filter file
msd:groupid         GROUPID             # [string] Group file
# msd:weightfile weights.dat            # [string] Optional weight file
msd:output_total    MSD_TOTAL           # [string] Total MSD output prefix
msd:output_types    MSD_TYPE            # [string] Type MSD output prefix
msd:output_track    MSD_TRACK           # [string] Tracked MSD output prefix
msd:output_group    MSD_GROUP           # [string] Group MSD output prefix

# ===== VACF Parameters =====
vacf:timestep       1.0                 # [real] Timestep (ps)
vacf:algo           1                   # [int] Algorithm: 0=nac, 1=ac-fft, 2=ac-nofft, 3=AR
vacf:projection     false               # [bool] Project along direction
vacf:noiso          false               # [bool] Anisotropic only (no isotropic)
vacf:total          true                # [bool] Compute total VACF
vacf:types          false               # [bool] Compute per-type VACF
vacf:track          false               # [bool] Track specific atoms
vacf:groups         false               # [bool] Compute per-group VACF
vacf:vdos           false               # [bool] Compute VDOS
vacf:lal_frac       1.0                 # [real] Fraction of steps for VDOS
vacf:normalize      true                # [bool] Normalize VACF
vacf:mass_weighted  false               # [bool] Use atomic masses as aggregation weights
vacf:remove_drift   false               # [bool] Remove mass-weighted center-of-mass velocity
vacf:ndim           3                   # [int] Number of dimensions
vacf:zero_padding   0                   # [int] Zero padding for FFT
vacf:dtau           0.2                 # [real] Smearing coefficient
vacf:tau0           2.0                 # [real] Smearing tau0
vacf:ismear         0                   # [int] Smearing type
vacf:fmax           50.0                # [real] Max frequency for smearing (THz)
vacf:dfreq          0.01                # [real] Frequency step for VDOS (THz)
vacf:start_from     0                   # [int] Starting frame index
vacf:end_to         -1                  # [int] End frame index (-1=all)
vacf:trackid        TRACKID             # [string] Track filter file
vacf:groupid        GROUPID             # [string] Group file
vacf:projdir        PROJDIR             # [string] Projection direction file
vacf:output_header  VACF                # [string] VACF output prefix
# vacf:weightfile weights.dat           # [string] Optional weight file
