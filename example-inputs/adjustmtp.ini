# adjustmtp — Reorder MTP potential
# Usage: imrmlp adjustmtp --settings adjustmtp.ini
#        imrmlp adjustmtp input.mtp output.mtp 1 0
#
# input, output and neworder may also be given as CLI positionals or flags.

input               input.mtp           # [string] Input MTP file
output              output.mtp          # [string] Output MTP file
neworder            1 0                 # [intvec] Output species order (swap species 0 and 1)
