# fastfit — Fast MTP fitting with basis selection
# Usage:
#   imrmlp fastfit fastfit.ini                     # Simple fit (mode 1)
#   imrmlp fastfit fastfit.ini -m 0                # Compute eigenvalue spectra
#   imrmlp fastfit fastfit.ini -m 4                # CUR-based basis selection
#   imrmlp fastfit fastfit.ini -m 5                # Temper (SA/greedy) refinement
#   imrmlp fastfit fastfit.ini -m 6                # NSGA-II basis selection
#   imrmlp fastfit fastfit.ini -m 7                # Correlation analysis & decorrelation
#
# Workflow:
#   mode 0 → mode 4 → mode 5 → mode 6 → trainmtp
#   mode 7 (correlation analysis + decorrelation) → mode 2 → trainmtp
#
# Normal equations are assembled from the current potential and training set.
# Old weighted MATATA/VECATA exports must be regenerated before validation.
# Mode 7 without corr-save-reduced only needs structures, not E/F/S labels.

# ===== Input/Output =====
potfile             potential.mtp       # [string] Initial MTP potential file
trainset            train.cfg           # [string] Training set (MLPCFG format)
validset            valid.cfg           # [string] Validation set (optional)
index               index.map           # [string] Index map file
format              mlpcfg              # [string] Data format: mlpcfg, extxyz, vaspabn

# ===== Performance Report =====
profile             false               # [bool] Exclusive stage timing and process-lifetime peak RSS
# profile-output    fastfit-profile.tsv  # [string] Optional TSV output; also enables profiling
# CLI: gpmain fastfit fastfit.ini -m 5 --profile-output fastfit-profile.tsv
# MPI report includes rank 0, mean/max timings, and per-rank RSS peak max/sum.
# The sum of rank peaks is not simultaneous memory usage. See docs/fastfit-profile_zh.md.

# ===== Optional exported-matrix validation (trainmtp --do-matrix-ata) =====
# Validation reassembles current blocks and rejects mismatched data/potential/normalization.
use-matrices        false               # [bool] Validate MATATA/VECATA blocks against current inputs
matE                MATATA_E            # [string] Energy ATA matrix (rows=coeffs, cols=coeffs)
vecE                VECATA_E            # [string] Energy ATy vector
matF                MATATA_F            # [string] Force ATA matrix
vecF                VECATA_F            # [string] Force ATy vector
matS                MATATA_S            # [string] Stress ATA matrix
vecS                VECATA_S            # [string] Stress ATy vector

# ===== Loss Function Weights =====
weight-energy       1                   # [real] Energy weight in loss function
weight-force        0.1                 # [real] Force weight in loss function
weight-stress       0.001               # [real] Stress weight in loss function
weight-l2           1e-8                # [real] L2 ridge regularization weight

# Weights multiply squared residuals; fitness applies to energy, atomic_fitness to forces.
# Virial residuals use all nine tensor entries. L2 adds weight-l2 to every diagonal.
energy-power        1                   # [real] Energy normalization: N^(-power)
force-power         0                   # [real] Force normalization: N^(-power)
stress-power        1                   # [real] Virial normalization: N^(-power)
force-norm-d        0.1                 # [real] Force normalization denominator offset
force-norm-f        0                   # [real] Force normalization scale; 0 disables
force-norm-p        1                   # [real] Force normalization exponent

# ===== Reproducible search =====
seed                42                  # [int] RNG seed (CUR, SA, NSGA-II, descriptor sampling)
search-steps        -1                  # [int] SA/greedy steps; -1 uses bounded automatic budget
population          0                   # [int] NSGA-II population; 0 uses automatic size
generations         0                   # [int] NSGA-II generations; 0 uses automatic budget
sa-temperature      1                   # [real] Temperature for mean per-configuration loss
sa-cooling          0.995               # [real] Temperature multiplier in (0,1]

# ===== Optional compute-cost selection (modes 5/6) =====
selection-objective legacy              # [string] legacy or error-cost
# max-valid-loss       0.02              # Required for error-cost; example only, mean weighted loss/config
# cost-benchmark-topk  8                 # Measured shortlisted models; full-basis baseline is additional
# cost-benchmark-configs 16              # Stratified validation configurations
# cost-archive-size    128               # Bounded cross-generation archive
# cost-benchmark-rounds 5                # At least 3 repeated timing rounds
# cost-benchmark-seconds 0.01            # Minimum seconds per model/path/round
# cost-report         fastfit-cost.tsv   # Accuracy, cost, timing, environment and original scalar IDs
# Requires labeled validset. See docs/fastfit-cost-selection_zh.md.

# ===== Mode Selection =====
# 0: Compute eigenvalues/eigenvectors of ATA, write EIGVEC/EIGVAL/EIGENSYS
# 1: Simple weighted least-squares fit (solves normal equations directly)
# 2: Apply a pre-computed basis selection from selected_ones.dat
# 3: Brute-force cut-one search — remove each basis and report error
# 4: CUR-based basis scoring and selection (writes selected_ones.dat/removed.dat)
# 5: Temper — swap-based refinement via simulated annealing or greedy hill-climbing
# 6: NSGA-II — multi-objective genetic optimization for basis subset selection
mode                1                   # [int] Fit mode (default: 0)

# ===== Solver (modes 1-4) =====
# llt   — Fast but may lose precision
# ldlt  — Robust, good accuracy in most cases (recommended)
# svd   — Most stable, slowest
# qr    — Good stability, moderate speed
# cod   — Complete orthogonal decomposition
method              ldlt                # [string] Linear solver method

# ===== Mode 1: Solver Comparison =====
cmp                 false               # [bool] Compare all solver methods

# ===== Mode 4: CUR-Based Selection =====
sparse-method       0                   # [int] 0: select high-score; 1: discard low-score
discard-rate        0.1                 # [real] Fraction of scalars to discard (0.0-1.0)
epslow              1e-6                # [real] Eigenvalue floor for low-score mode
cur                 false               # [bool] Use CUR random sampling instead of top-k
cur-nsearch         10                  # [int] CUR random search iterations
addback             false               # [bool] Add back on-path scalar moments

# ===== Mode 5: Temper =====
# method=greedy enables greedy hill-climbing (always accept improvements only)
# method=anything-else uses simulated annealing (accept worse swaps probabilistically)

# ===== Mode 7: Correlation Analysis & De-correlation =====
# This mode computes raw scalar-moment descriptors from the training set,
# performs comprehensive correlation analysis (Pearson, VIF, condition
# number, SVD spectrum), and applies a de-correlation strategy to select
# a minimally redundant basis subset.
#
# Output files:
#   correlation_summary.txt      — Human-readable diagnostic summary
#   correlation_matrix.dat       — Full Pearson correlation matrix
#   correlation_vif.dat          — VIF per feature
#   correlation_eigenvalues.dat  — Eigenvalue spectrum
#   correlation_pairs.dat        — Highly correlated pairs (|r| > 0.8)
#   correlation_selection.dat    — Selection outcome per strategy
#   selected_ones.dat            — Count followed by unshifted scalar IDs; compatible with modes 2/5/6
#   removed.dat                  — Complementary unshifted scalar IDs; compatible with modes 2/5/6
#   __DECORR__.mtp               — (optional) Reduced potential
#
corr-strategy       0                   # [int] 0=threshold, 1=clustering, 2=greedy VIF
corr-pearson        0.95                # [real] Pearson threshold (strategies 0, 1)
corr-vif            10.0                # [real] VIF threshold (strategies 0, 2)
corr-max-samples    50000               # [int] Max atoms for correlation matrix
corr-max-features   0                   # [int] Max features to keep (strategy 2, 0=no limit)
corr-addback        false               # [bool] Add back on-path scalar moments for DAG integrity
corr-save-reduced   false               # [bool] Save __DECORR__.mtp after selection
