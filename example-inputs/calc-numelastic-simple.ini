# Numerical elastic constants — imrmlp calc_elastic --settings calc-numelastic-simple.ini --potfile potential.mtp --input POSCAR

# ===== Input/Output =====
input-format        POSCAR              # [string]
index               index.map           # [string] Index file
input               POSCAR              # [string] Structure file

# ===== Potential =====
potfile             potential.mtp       # [string]
pottype             mtp                 # [string]

# ===== Strain Sampling =====
method              numerical           # [string] Numerical strain method
strain-magnitude    0.005               # [real]
num-strain-points   5                   # [int]
