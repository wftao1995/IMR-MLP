# calc-trjavg — Compute average structure from trajectory
# NOTE: CLI reference only — calc_trjavg does not load .ini files.
# Usage: imrmlp calc_trjavg [options]
#
input-file          POSCAR              # [string] Input trajectory file
output-file         average.xyz         # [string] Output average structure
input-format        POSCAR              # [string] Input format
index               index.map           # [string] Index file
overwrite           false               # [bool] Overwrite output
