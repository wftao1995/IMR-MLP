# swap-axis — Reorder a/b/c axes
# CLI reference only — this command does not load .ini files.
input               POSCAR              # [string]
input-format        POSCAR              # [string]
output              SWAPCAR             # [string]
output-format       POSCAR              # [string]
index               index.map           # [string]
order               xyz                 # [string] New axis order: xyz, xzy, yxz, yzx, zxy, zyx
overwrite           false               # [bool]
