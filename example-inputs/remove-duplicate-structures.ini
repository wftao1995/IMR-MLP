# remove-duplicate-structures — Remove symmetry-equivalent structures
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp remove_duplicate_structures [options]
#
input               structures.cfg      # [string] Input structures file
output              unique.cfg          # [string] Output unique structures file
index               index.map           # [string] Index file
sym-prec            1e-4                # [real] Symmetry tolerance
vol-prec            0.01                # [real] Volume tolerance
pos-tol             0.1                 # [real] Position matching tol. (A)
desc-factor         10.0                # [real] Descriptor factor for fastalgo
overwrite           false               # [bool] Overwrite output
