# Generate a small moment-tensor topology; run in a fresh working directory:
# imrmlp mtmbasis --settings mtmbasis-simple.ini
# No structure or pre-existing alpha pool is required.

# ===== Topology =====
max_lev             8
max_dim             2
max_mu              2
max_nv              2

# ===== Search =====
mode                3
seed                17
maxiter             100
# Output: potential.mtp_0 (topology, not a trained potential).
# Complete example: examples/mtp-workflow/README.md
