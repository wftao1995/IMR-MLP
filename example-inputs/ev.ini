# calc_eos — Energy-Volume curve and EOS fitting
# Usage: imrmlp calc_eos ev.ini
#        imrmlp calc_eos ev.ini --curve pv   # Pressure-Volume mode
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file
input-format        POSCAR              # [string] Input structure format
index               index.map           # [string] Index file
output              e-v.dat             # [string] EOS curve data output
output-eos          eos.dat             # [string] EOS fitting parameters output
traj-format         mlpcfg              # [string] Output trajectory format
lossless            false               # [bool] Enable lossless output

# ===== Potential =====
pot:pottype         mtp                 # [string] Potential type
pot:potfile         potential.mtp       # [string] Potential file

# ===== Volume Sampling =====
npos                5                   # [int] Number of volume points with V > V0
nneg                5                   # [int] Number of volume points with V < V0
upper               0.05                # [real] Upper bound of volume expansion fraction
lower               -0.05               # [real] Lower bound of volume contraction fraction

# ===== Control =====
fit-only            false               # [bool] Fit EOS only (reuse existing data)
skip-prelax         false               # [bool] Skip preliminary relaxation
#ninterp            100                 # [int] Number of interpolation points

# ===== Relaxation (per volume point) =====
relax:driver        lbfgs               # [string] Relaxation algorithm
relax:maxiteration  5000                # [int] Max iterations per volume point
relax:gtol          1e-3                # [real] Gradient tolerance
relax:relax_cell    true                # [bool] Relax cell
relax:relax_atom    true                # [bool] Relax atoms
relax:index         index.map           # [string] Index file tag
relax:nblock        10                  # [int] Output interval
relax:bfgs_m        50                  # [int] BFGS history
relax:stepmax       0.01                # [real] Max step
relax:car_mode      false               # [bool] Cartesian mode
relax:cell_strain   true                # [bool] Use strain-based cell relaxation
relax:symm_strain   true                # [bool] Use symmetric strain
