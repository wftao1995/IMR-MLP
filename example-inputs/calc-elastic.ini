# calc-elastic — Calculate elastic constants (analytical)
# Usage: imrmlp calc_elastic --settings calc-elastic.ini --potfile potential.mtp --input POSCAR
#
input-format    POSCAR      # [string] Input format
index           index.map   # [string] Index file
potfile     potential.mtp     # [string] Potential file
input           POSCAR      # [string] Structure file
symprec         1e-4        # [real] Symmetry tolerance
pressure        0           # [real] External pressure (GPa)
compute-eigsys  false       # [bool] Compute eigensystem
use-gemo-mean   false       # [bool] Use geometric mean
eigzero-tol     1e-6        # [real] Zero eigenvalue tolerance
relax-correction true       # [bool] Relax correction for elastic constants
correction-l1   false       # [bool] 1st order correction 1
correction-l2   false       # [bool] 1st order correction 2
