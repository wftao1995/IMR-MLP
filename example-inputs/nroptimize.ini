# nroptimize — Newton-Raphson saddle point search
# NOTE: CLI reference only — nroptimize does not load .ini files.
# Usage: imrmlp nroptimize [options]
# Exit 0: converged; exit 2: iteration limit without convergence (final output saved).
# max-iteration=0 checks the initial state; gtol must be finite and positive.
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file
output              CONTCAR             # [string] Output structure
index               index.map           # [string] Index file
#input-format       POSCAR              # [string] (not registered as CLI option)
#output-format      POSCAR              # [string] (not registered as CLI option)

# ===== Potential =====
potfile             potential.mtp       # [string] Potential file

# ===== Optimizer =====
max-iteration       100                 # [int] Max iterations
alpha-reduce        0.75                # [real] Alpha reduction factor
no-cell             false               # [bool] Freeze cell
external-stress     0                   # [real] External stress (GPa)
fixed-atoms                             # [intvec] Fixed atom indices

# ===== Tolerance =====
eigzero-tol         1e-6                # [real] Zero eigenvalue tolerance
