# split-set — Split structure datasets into multiple files
# NOTE: CLI reference only — split_set does not load .ini files.
# Usage: imrmlp split_set [options] <input> <output-prefix>
# Ratio example: imrmlp split_set dataset.cfg split_ --ratios=8,1,1 --shuffle yes
# Equal example: imrmlp split_set dataset.cfg split_ -n 2 --shuffle yes
#
ratios              8,1,1               # [string] Relative weights; sets the subset count
# nsplit            10                  # [int] Equal round-robin subsets; omit ratios (default 10)
shuffle             false               # [bool] Random shuffle before split
