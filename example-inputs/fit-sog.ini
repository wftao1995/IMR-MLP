# imrmlp trainnlpot --settings fit-sog.ini --do-lbfgs --output fitted-sog.mtp
# Replace these input paths with a compatible species map, dataset and MTP model.

# ===== Input/Output =====
index               index.map
trainset            train.cfg
trainset-format     mlpcfg

# ===== Potential =====
pot:pottype         mtp_les
pot:potfile         initial.mtp
pot:les_kernel      sog
pot:sog_terms       8
pot:sog_log_bandwidth_min -4
pot:sog_log_bandwidth_max 1
pot:les_dl          1.0
pot:les_cutoff_mode smooth
pot:les_taper_fraction 0.1

# ===== Training Schedule =====
fit:training_schedule mtp_sog_from_scratch
fit:sr_stage_iterations 100
fit:les_stage_iterations 50
fit:joint_stage_iterations 200
fit:sog_zero_init_range 0.1
fit:les_zero_init_seed 5489

# ===== Loss Weights =====
fit:energy_weight   1
fit:force_weight    0.05
fit:stress_weight   0.001
fit:charge_weight   0
fit:penalty_weight  1e-8

# ===== Parameter Scaling =====
fit:parameter_scaling group_auto
fit:scale_floor     1e-3
fit:scale_ceiling   1
fit:scaled_step_max 1

# ===== Output =====
fit:save_to         fitted-sog.mtp
