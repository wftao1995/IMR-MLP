# initmtpm (simple) — minimal MTP-M quadratic-head settings
# Usage: imrmlp initmtpm --settings initmtpm-simple.ini
# Prepare inputs as described in docs/reference/commands.md#initmtpm--initialize-mtp-based-models.
pot:pottype     mtp_m               # [string] Model family
pot:extmodel    mtp_m_q2            # [string] Two-descriptor quadratic head
pot:potfile     head-template.mtp   # [string] Input template (no head coefficients)
potfile         initialized.mtp     # [string] Legacy native output model
dataset         train.xyz           # [string] Reference dataset for offset/statistics
format          extxyz              # [string] Dataset format
index           index.map           # [string] Index file
randomize       true                # [bool] Randomize head coefficients
