# convstr — Convert structures between formats
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp convstr [options] inputfiles outputfile
#
# ===== Input/Output =====
input-format                            # [string] Input format (auto-detect if empty)
output-format                           # [string] Output format (auto-detect if empty)
index               index.map           # [string] Index file
overwrite           false               # [bool] Overwrite existing file
append              false               # [bool] Append to existing file

# ===== Image Selection =====
start               0                   # [int] Start image index
end                 -1                  # [int] End image index
select              -1                  # [intvec] Select specific image indices
last                false               # [bool] Output only final image
loadrate            1                   # [int] Read every N-th structure
outrate             1                   # [int] Write every N-th structure
reverse             false               # [bool] Reverse image order
shuffle             false               # [bool] Random shuffle images
sort-by                                 # [string] Sort keys: energy,fenergy,fitness,volume,size,id or global attrs
sort-order          asc                 # [string] Sort direction: asc or desc (single or comma-separated)
bstart              true                # [bool] ID start from N

# ===== Output Layout =====
separator           _                   # [string] Filename-ID separator
write-symbol        false               # [bool] Use element symbols (vs IDs)
pack-atoms          true                # [bool] Consolidate atom types
magnetic            false               # [bool] Read magnetic moments
force-tilt          false               # [bool] Force tilt cell in LAMMPS data
force-one           false               # [bool] Write all to single file
wrap                true                # [bool] Wrap coordinates to PBC

# ===== Displacement =====
apply-disp          false               # [bool] Apply displacement
rand-type           0                   # [int] Disp type: 0=gaussian, 1=uniform
disp-mag            0.01                # [real] Displacement magnitude
