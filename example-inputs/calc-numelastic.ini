# Numerical elastic constants — imrmlp calc_elastic --settings calc-numelastic.ini --potfile pot.mtp --input POSCAR
#
input-format    POSCAR          # [string] Input format
index           index.map       # [string] Index file
potfile         pot.mtp         # [string] Potential file
pottype         mtp             # [string] Potential type
input           POSCAR          # [string] Structure file
method          numerical       # [string] Numerical strain method
strain-magnitude 0.005          # [real] Strain magnitude
num-strain-points 5             # [int] Number of strain points (odd)
mode            0               # [int] 0=stress-strain, 1=energy-strain
elastic-output  elastic.out     # [string] Output file
symprec         1e-4            # [real] Symmetry tolerance
pressure        0               # [real] External pressure (GPa)
use-gemo-mean   false           # [bool] Use geometric mean
eigzero-tol     1e-6            # [real] Zero eigenvalue tolerance
relax:driver    lbfgs           # [string] Relax driver
relax:maxiteration 5000         # [int] Max relax iterations
relax:gtol      1e-3            # [real] Gradient tolerance
