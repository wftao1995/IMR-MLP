# dimer — Dimer method for transition state search
# Usage: imrmlp dimer dimer.ini
#
# ===== Input/Output =====
structure           POSCAR              # [string] Input structure (initial guess for TS)
input-format        POSCAR              # [string] Input structure format
index               index.map           # [string] Index file for atom types
output              CONTCAR             # [string] Output relaxed saddle point

# ===== Potential =====
pot:potfile         potential.mtp       # [string] Potential file
pot:pottype         mtp                # [string] Potential type

# ===== MODECAR =====
# dimer:modecarf      MODECAR            # [string] Initial dimer direction (optional)
# Omitted/empty: random direction. An invalid explicit file is an error.
# Legacy numeric files: exactly offset + 3*N finite values, normalized together.
# Fixed cell: Cartesian atomic directions in input atom order.
# VC symmetric cell: E=D*D^T-I, order xx xy xz yy yz zz (not engineering shear).
# VC full cell: D-I in row-major order; D=inverse(H_ref)*H.
# VC atoms: ds*H_ref with recast_atomic_force=true, otherwise fractional ds.
# New exports include a GPML_MODECAR header and (for VC) the reference cell.
# For modefollowing --mode=9 VC exports, match the settings printed at export:
# default source -> symm_strain=true, restore_F_cholesky=false, recast=true;
# --car-rep source -> symm_strain=false, recast=true. Use the same initial cell.

# ===== Dimer Method =====
dimer:ddr           5e-3                # [real] Dimer separation (ΔR)
dimer:rot_force_min 1e-2                # [real] Skip rotation if rotational force < this
dimer:gtol          1e-2                # [real] Outer loop force convergence tolerance
dimer:maxiteration  1000                # [int] Max outer iterations
dimer:min_curvature -1e-6               # [real] Min curvature for saddle detection (must be < 0)
dimer:write_traj    false               # [bool] Write trajectory
dimer:trajfile      dimer.trj           # [string] Trajectory output file
dimer:nblock        10                  # [int] Output interval
dimer:debug         0                   # [int] Debug level

# ===== Rotation Sub-Optimizer =====
dimer:rot_driver    fire                # [string] Optimizer: fire, lbfgs, cg, sgd
dimer:rot_max_iter  50                  # [int] Max rotation iterations per cycle
dimer:rot_gtol      1e-3                # [real] Rotation force tolerance
dimer:rot_max_step  0.5                 # [real] Rotation max step
dimer:rot_first_step 0.01               # [real] Rotation first step

# ===== Translation Sub-Optimizer =====
dimer:trn_driver    fire                # [string] Optimizer: fire, lbfgs, cg, sgd
dimer:trn_max_iter  200                 # [int] Max translation iterations per cycle
dimer:trn_gtol      1e-2                # [real] Translation force tolerance
dimer:trn_max_step  0.2                 # [real] Translation max step
dimer:trn_first_step 0.01               # [real] Translation first step

# ===== VC-DIMER =====
dimer:vcflag        false               # [bool] Enable Variable Cell DIMER
dimer:symm_strain   true                # [bool] Use symmetric strain (6-component)
dimer:restore_F_cholesky true            # [bool] Cholesky for strain restoration
dimer:recast_atomic_force true           # [bool] Recast atomic forces with strain
dimer:pressure      0                   # [real] External pressure (GPa)
dimer:cell_factor   1.0                 # [real] Cell preconditioning factor

# Reproducible initialization when no MODECAR is specified.
dimer:random_seed 0
