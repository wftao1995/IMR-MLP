# mtp2spline — Convert MTP to spline representation
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp mtp2spline [options]
#
input               potential.mtp             # [string] Input MTP file
output              pot.spline          # [string] Output splined file
delta-r             0.01                # [real] Spline grid spacing
r-min               -1                  # [real] Inner radius (-1=auto)
