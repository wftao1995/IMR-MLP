# findint — Find interstitial sites via Voronoi tessellation
# NOTE: CLI reference only — findint does not load .ini files.
# Usage: imrmlp findint [options]
#
input               POSCAR              # [string] Input structure file
input-format        POSCAR              # [string] Input format
output-format       POSCAR              # [string] Output format
index-file          index.map           # [string] Index file
min-dist            0.5                 # [real] Min distance to existing atoms
cluster-tol         0.5                 # [real] Cluster tolerance
sites-only          false               # [bool] Only output site positions
near-elem                               # [string] Near element filter
near-pos                                # [realvec] Near position filter
near-radius         2.0                 # [real] Near search radius
