# mtpbasis — Remap MTP coefficients
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp mtpbasis [options]
#
source              ref.mtp             # [string] Reference potential
target              src.mtp             # [string] Source potential to remap
source-map          map1.txt            # [string] Reference basis mapping
target-map          map2.txt            # [string] Source basis mapping
