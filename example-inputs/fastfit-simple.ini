# fastfit (simple) — Minimal fast MTP fitting configuration
# Usage: imrmlp fastfit fastfit-simple.ini
#
# Required: pre-computed design matrices from trainmtp --do-matrixATA

# ===== Input/Output =====
potfile             potential.mtp       # [string] Initial MTP potential file
trainset            train.cfg           # [string] Training set (MLPCFG format)
validset            valid.cfg           # [string] Validation set
index               index.map           # [string] Index map file
format              mlpcfg              # [string] Data format

# ===== Design Matrices (from trainmtp --do-matrixATA) =====
matE                MATATA_E            # [string] Energy ATA matrix file
vecE                VECATA_E            # [string] Energy ATy vector file
matF                MATATA_F            # [string] Force ATA matrix file
vecF                VECATA_F            # [string] Force ATy vector file
matS                MATATA_S            # [string] Stress ATA matrix file
vecS                VECATA_S            # [string] Stress ATy vector file

# ===== Fitting =====
weight-energy       1                   # [real] Energy weight in loss
weight-force        0.1                 # [real] Force weight in loss
weight-stress       0.001               # [real] Stress weight in loss
weight-l2           1e-8                # [real] L2 regularization
mode                1                   # [int] Fit mode (0-6)
method              ldlt                # [string] Solver: llt, ldlt, svd, qr, cod
