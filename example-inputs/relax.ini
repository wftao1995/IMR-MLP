# relax — Relax structures using various optimization methods and constraints
# Usage: imrmlp relax relax.ini
# Full parameter reference; start with relax-simple.ini and docs/guides/relaxation.md.
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file to be relaxed
output              CONTCAR             # [string] Output relaxed structure file
input-format        POSCAR              # [string] Input structure file format
output-format       POSCAR              # [string] Output structure file format
index               index.map           # [string] Index file for type mapping

# ===== Potential =====
pot:potfile         potential.mtp       # [string] Potential parameter file
pot:pottype         mtp                 # [string] Potential type (mtp, eam, lj612, ...)

# ===== General Settings =====
isif                3                   # [int] VASP-like isif (2-8): determines which DOF to relax
write-force         true                # [bool] Write forces into output file
write-stress        true                # [bool] Write stress into output file
write-ateng         true                # [bool] Write atomic energies into output file
discard-all         false               # [bool] Discard all extra info when writing output
#create-input       false               # [bool] (relaxstr2 only) Create example minimal input file and exit

# ===== Relaxation Driver =====
relax:driver        lbfgs               # [string] Algorithm: cg, lbfgspp (recommended), lbfgs, gd, fire
relax:stepmax       0.1                 # [real] Maximum allowable step size per variable update
relax:gtol          1e-3                # [real] Gradient convergence tolerance
relax:ftol          0                   # [real] Energy convergence tolerance (0=disabled)
relax:xtol          0                   # [real] Step convergence tolerance (0=disabled)
#relax:ztol         1e-6                # [real] (not implemented) Zero threshold for numerical checks
#relax:eps          1e-6                # [real] (not implemented) Machine epsilon for division-by-zero prevention
relax:nblock        10                  # [int] Output info every N iterations
relax:pressure      0                   # [real] External hydrostatic pressure (GPa)
#relax:external_stress                  # [realvec] External stress tensor (6 or 9 components, GPa)
#relax:ciival                           # [realvec] Stiffness for strain modes (6 comp, GPa) — diagonal Cii estimate
#relax:cell_factor  1.0                 # [real] (use relax:stress_scaling instead) Stress preconditioning factor

# ===== Relaxation Flags =====
relax:relax_atom    true                # [bool] Relax atomic positions
relax:relax_cell    true                # [bool] Relax cell parameters
relax:cell_strain   true                # [bool] Use strain-based cell relaxation (recommended)
relax:symm_strain   true                # [bool] Use symmetric strain (prevents rotation)
relax:fix_vol       false               # [bool] Fix volume while relaxing cell
relax:fix_shape     false               # [bool] Fix cell shape while relaxing volume
relax:selective_dynamics false          # [bool] Enable selective dynamics (read from POSCAR or seldyn_file)
relax:freeze_small_gd false             # [bool] Zero gradients below tolerance
relax:apply_disp    false               # [bool] Apply random initial displacements
relax:disp          0.01                # [real] Magnitude of random displacement

# ===== Symmetry-Constrained Relaxation =====
# keep_symm: Reduce optimization variables to the asymmetric unit.
#   - Automatically detects space group via spglib.
#   - Projects cell and atomic coordinates onto the detected invariant subspace.
#   - Coupled site modes are retained; it does not imply symm_force=true.
#   - Works with cell-only, pos-only, or full relaxation.
#   - Mutually exclusive with: selective_dynamics, constraint_vib_modes,
#     linear_constraint, linear_transform, cartesian=true.
relax:keep_symm     false               # [bool] Symmetry-constrained relaxation

# ===== VC-DFT Options =====
relax:atomic_force_recast true          # [bool] Recast atomic forces with strain
#relax:lattice_mask                     # [intvec] (use relax:strain_mask instead) Lattice/strain mask
#relax:strain_mask                      # [intvec] Strain mask: 6 (symm) or 9 (unsymm) components

# ===== Coupling =====
relax:couple        0                   # [int] Lattice coupling: 0=none, 1=a-b, 2=b-c, 3=c-a, 4=all
relax:dprecond      true                # [bool] Diagonal preconditioning (recommended for direct coords)

# ===== Trajectory =====
relax:write_traj    false               # [bool] Write relaxation trajectory
relax:trajfile      relax-trajectory.xyz # [string] Trajectory output file

# ===== Constraint Files =====
relax:seldyn_file   SELECTIVE_DYNAMICS  # [string] SD file (not needed when input is POSCAR)
relax:index         index.map           # [string] Species index file for selective dynamics
relax:lc_file       LINEAR_CONSTRAINT   # [string] Linear constraints definition file
relax:lf_file       LINEAR_TRANSFORM    # [string] Linear transforms definition file
relax:vib_file      VIB_CONSTRAINT      # [string] Vibrational normal modes file
#relax:precond_file PRECONDITION        # [string] Preconditioning config file

# ===== Constraint Solvers =====
relax:constraint_loops 5                # [int] Max outer iterations for constraint solving
#relax:with_constraint_aul false        # [bool] Use AUL constraint solver
#relax:with_constraint_sqp false        # [bool] Use SQP constraint solver
#relax:with_constraint_nlc false        # [bool] Use NLC constraint solver
#relax:with_constraint_lc false         # [bool] Use LC constraint solver
#relax:with_constraint_vib false        # [bool] Use vibrational constraint solver

# ===== FIRE Optimizer Parameters =====
relax:fire:ts_max   10.0                # [real] Max time step
relax:fire:ts_min   0.001               # [real] Min time step
relax:fire:ts_init  2.0                 # [real] Initial time step
relax:fire:mdalgo   0                   # [int] MD algorithm
relax:fire:alpha_start 0.25             # [real] Initial alpha
relax:fire:alpha_reduce 0.99            # [real] Alpha reduction factor
relax:fire:ts_grow  1.1                 # [real] Time step growth factor
relax:fire:ts_reduce 0.5                # [real] Time step reduction factor
relax:fire:vdfmax   2000                # [int] Max velocity filter iterations
relax:fire:do_backward false            # [bool] Enable step backtracking
relax:fire:initial_delay 0              # [int] Initial delay steps
relax:fire:ts_backratio 0.5             # [real] Backtracking ratio
relax:fire:ndelay   0                   # [int] Number of delay steps
relax:fire:downhill_check false         # [bool] Check downhill condition (fire2)
#relax:fire:first_step                  # [real] First step size
#relax:fire:first_delay                 # [real] First step delay

# ===== GD Optimizer Parameters =====
relax:gd:step_max_init_cell 0.1         # [real] Initial max step for cell
relax:gd:step_upscale 1.2               # [real] Step upscale factor
relax:gd:step_downscale 0.2             # [real] Step downscale factor

# ===== L-BFGS Parameters =====
relax:bfgs_m        15                  # [int] BFGS history length
relax:lbfgspp:epsilon 0                 # [real] LBFGSpp gradient tolerance
relax:lbfgspp:past  0                   # [int] LBFGSpp past steps for convergence check
relax:lbfgspp:delta 1e-6                # [real] LBFGSpp delta for convergence
relax:lbfgspp:max_iterations 1000       # [int] LBFGSpp max iterations
relax:lbfgspp:linesearch 0              # [int] LBFGSpp linesearch algorithm
relax:lbfgspp:max_linesearch 50         # [int] LBFGSpp max linesearch steps
relax:lbfgspp:min_step 1e-10            # [real] LBFGSpp min step
relax:lbfgspp:max_step 1e10             # [real] LBFGSpp max step
relax:lbfgspp:ftol  1e-4                # [real] LBFGSpp function tolerance
relax:lbfgspp:wolfe 0.9                 # [real] LBFGSpp Wolfe condition parameter
relax:lbfgspp:initial_step 0            # [real] LBFGSpp initial step
relax:lbfgspp:damping 0                 # [real] LBFGSpp damping parameter
