# Minimal fixed-cell relaxation
# Replace model/structure paths and check species mapping.
# Workflow: docs/guides/relaxation.md
# Exit codes: 0 converged, 2 unconverged, 1 error.

# ===== Input/Output =====
input               POSCAR
output              relaxed.xyz
index               index.map

# ===== Potential =====
pot:potfile         model.mtp

# ===== Relaxation =====
relax:cartesian     true
relax:stepmax       0.05
relax:gtol          0.001
relax:maxiteration  500

# ===== Trajectory =====
relax:write_traj    true
