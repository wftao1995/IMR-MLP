# diverse-select — FPS/CUR diversity-based selection
# Usage: imrmlp diverse_select diverse-select.ini
#
pool                pool.xyz            # [string] Input structure pool
output              selected.xyz        # [string] Output selected structures
index               index.map           # [string] Index map file
format              extxyz              # [string] Input format
method              fps                 # [string] Method: fps (default), cur
n-select            50                  # [int] Number of structures to select
metric              euclidean           # [string] FPS metric: euclidean, cosine
first-idx           -1                  # [int] FPS first index (-1=random)
seed                42                  # [int] Random seed
threshold-distance  -1                  # [real] FPS stop threshold
cur-deterministic   false               # [bool] CUR deterministic top-k
compute-error       false               # [bool] CUR reconstruction error
score-file                              # [string] Output per-structure scores
verbose             false               # [bool] Verbose output

builder:dtype       mtm                 # [string] Descriptor type
builder:potfile     potential.mtp       # [string] Potential file
builder:mode        cfg                 # [string] Row mode: cfg, nbh
builder:all-coeffs  false               # [bool] Use ALL coefficients
builder:w-energy    1.0                 # [real] Energy weight
builder:w-site      0                   # [real] Site-energy weight
builder:w-force     0                   # [real] Force weight
builder:w-stress    0                   # [real] Stress weight
