# initmtpm — Initialize an MTP-M quadratic head
# Usage: imrmlp initmtpm --settings initmtpm.ini
# Prepare a fresh head template and labeled data; see docs/reference/commands.md#initmtpm--initialize-mtp-based-models.
# Modern template flow (no training data needed):
#   imrmlp initmtpm --input head-template.mtp --type mtp_m --output initialized.gpm

# ===== Input/Output =====
potfile             initialized.mtp     # [string] Output file (flat key); preserve the input
dataset             train.xyz           # [string] Reference dataset for initialization
format              extxyz              # [string] Dataset format
index               index.map           # [string] Index file

# ===== Potential =====
pot:pottype         mtp_m               # [string] Model family
pot:extmodel        mtp_m_q2            # [string] Two-descriptor quadratic head
pot:potfile         head-template.mtp   # [string] Input template, without trained head coefficients

# ===== Head Initialization =====
randomize           true                # [bool] Randomize coefficients
rand-scale          1.0                 # [real] Scale for random coefficients
rand-lb             -0.1                # [real] Lower bound for random coeffs
rand-ub             0.1                 # [real] Upper bound for random coeffs
