# initmtpm — Initialize MTP_M potential with random coefficients
# Usage: imrmlp initmtpm initmtpm.ini
#
# ===== Input/Output =====
index               index.map           # [string] Index file
format              mlpcfg              # [string] Dataset format

# ===== Potential =====
pot:potfile         template.mtp        # [string] Template MTP file (load)
potfile             template.mtp        # [string] Output MTP filename (save — flat key, must match load)

# ===== Random Coefficients =====
randomize           true                # [bool] Randomize coefficients
rand-scale          1.0                 # [real] Scale for random coefficients
rand-lb             -0.1                # [real] Lower bound for random coeffs
rand-ub             0.1                 # [real] Upper bound for random coeffs
