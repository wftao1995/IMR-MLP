# sameq — Check if two structures are equivalent
# NOTE: CLI reference only — sameq does not load .ini files.
# Usage: imrmlp sameq [options]
#
# ===== Input/Output =====
input1              POSCAR1             # [string] First structure
input2              POSCAR2             # [string] Second structure
input-format1       POSCAR              # [string] First format
input-format2       POSCAR              # [string] Second format
index               index.map           # [string] Index file

# ===== Comparison =====
tol                 0.1                 # [real] Position tolerance (A)
scale               false               # [bool] Scale to same volume
