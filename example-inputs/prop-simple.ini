# calc_prop (simple) — Minimal analysis configuration
# Usage: imrmlp calc_prop prop-simple.ini
#
# ===== Input/Output =====
input               input.cfg           # [string] Input trajectory file
input-format        extxyz              # [string] Input format
index               index.map           # [string] Index file
cutoff              5.0                 # [real] Neighborhood cutoff

# ===== Analysis to Compute =====
rdf                 true                # [bool] Compute RDF
sro                 true                # [bool] Compute SRO
bondangle           true                # [bool] Compute bond angles
ha-index            true                # [bool] Compute HA indices
