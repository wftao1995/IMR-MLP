# calc_eos (simple) — Minimal E-V configuration
# Usage: imrmlp calc_eos ev-simple.ini
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file
index               index.map           # [string] Index file

# ===== Potential =====
pot:pottype         mtp                 # [string] Potential type
pot:potfile         potential.mtp       # [string] Potential file

# ===== Volume Sampling =====
npos                5                   # [int] Positive volume points
nneg                5                   # [int] Negative volume points
upper               0.05                # [real] Upper volume bound
lower               -0.05               # [real] Lower volume bound

# ===== Relaxation =====
relax:driver        lbfgs               # [string] Relaxation algorithm
relax:maxiteration  5000                # [int] Max iterations
