# fit (simple) — Minimal training configuration
# Usage: imrmlp trainmtp fit-simple.ini
#
# ===== Input/Output =====
index               index.map           # [string] Index file
trainset            train.xyz           # [string] Training set
validset            valid.xyz           # [string] Validation set (optional)
# ===== Potential =====
potfile             potential.mtp       # [string] Initial potential file

# ===== Weights =====
fit:energy_weight   1                   # [real] Energy weight
fit:force_weight    0.05                # [real] Force weight
fit:stress_weight   0.001               # [real] Stress weight
fit:weight_L2       1e-8                # [real] L2 regularization

# ===== L-BFGS =====
fit:bfgs_maxiteration 50000             # [int] Max BFGS iterations

# ===== SGD =====
fit:learning_rate   1e-3                # [real] SGD learning rate
fit:epoch_limit     200                 # [int] SGD max epochs
fit:batch_size      80                  # [int] Batch size
