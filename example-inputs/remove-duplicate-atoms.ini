# remove-duplicate-atoms — Remove duplicate atoms based on distance
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp remove_duplicate_atoms [options]
#
input               POSCAR              # [string] Input file
output              POSCAR_REMOVED_DUPS # [string] Output file
input-format        POSCAR              # [string] Input format
output-format       POSCAR              # [string] Output format
index               index.map           # [string] Index file
mode                delete              # [string] delete or merge
rtol                0.5                 # [real] Distance tolerance (A)
