# mk-orth — Find orthogonal cell (keep lattice vector a)
# CLI reference only — this command does not load .ini files.
# Usage: imrmlp mk_orth [options]
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file
output              ORCCAR              # [string] Output orthogonal structure
input-format        POSCAR              # [string] Input format
output-format       POSCAR              # [string] Output format
index               index.map           # [string] Index file
overwrite           false               # [bool] Overwrite output

# ===== Search =====
tol                 1e-4                # [real] Tolerance
max-expand          10                  # [int] Max expansion
search-only         false               # [bool] Search only
