# calc-err — Calculate errors relative to reference data
# Usage: imrmlp calc_err calc-err.ini
#
input               valid.cfg           # [string] Input structure file (reference)
input-format        POSCAR              # [string] Input file format
index               index.map           # [string] Index file
#input-predict      predicted.xyz       # [string] ML-predicted structures (omit to compute)
pot:potfile         potential.mtp             # [string] Potential file
pot:pottype         mtp                # [string] Potential type
#output-energy-diff energy_diff.dat     # [string] Output energy differences (omit = stdout)
#output-force-diff  force_diff.dat      # [string] Output force differences (omit = stdout)
#output-stress-diff stress_diff.dat     # [string] Output stress differences (omit = stdout)
#output-summary     summary.dat         # [string] Summary output file (omit = stdout)
show-progress       false               # [bool] Report completed structure counts
