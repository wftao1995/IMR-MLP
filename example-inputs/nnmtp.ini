# nnmtp — Create NNMTP potential template
# Usage: imrmlp nnmtp [options]
#
# imrmlp nnmtp --settings nnmtp.ini

# ===== Input/Output =====
data                train.cfg           # [string] Training structures
output              nnmtp.pot           # [string] Output NNMTP file
index               index.map           # [string] Index file
input-format        mlpcfg              # [string] Input format

# ===== Potential =====
potfile             template.mtp        # [string] MTP template file
