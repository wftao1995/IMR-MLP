# fit — Train MTP / nonlinear potential using reference data
# Usage: imrmlp trainmtp fit.ini      # MTP training (uses flat potfile cmdopt)
#        imrmlp trainnlpot fit.ini     # Nonlinear potential training (uses [pot] subsection)
#
# NOTE: Some parameters are command-specific, marked as [mtp], [nlpot], or [both].
#
# ===== Input/Output [both] =====
index               index.map           # [string] Index file mapping atom types to indices
trainset            train.xyz           # [string] Training set file (EXTXYZ format)
validset            valid.xyz           # [string] Validation set file (optional)
trainset-format     mlpcfg              # [string] Training data format
# NOTE: output is always saved to _Trained_Potential_.mtp

# ===== Potential =====
# trainmtp reads flat potfile cmdopt; trainnlpot reads pot:potfile via [pot] subsection:
potfile             potential.mtp       # [string] [mtp] Initial MTP potential file
pot:potfile         potential.mtp       # [string] [nlpot] Potential parameter file
pot:pottype         mtp                # [string] [nlpot] Potential type (mtp, eam, lj612, ...)

# ===== Fitting Control [both] =====
fit:energy_weight   1                   # [real] Energy weight in loss function
fit:force_weight    0.05                # [real] Force weight in loss function
fit:stress_weight   0.001               # [real] Stress weight in loss function
fit:energy_pow      1                   # [real] Energy weight power
fit:force_pow       0                   # [real] Force weight power
fit:stress_pow      1                   # [real] Stress weight power
fit:penalty_weight  1e-6                # [real] Orthogonality penalty weight
fit:force_wgt_d     0.1                 # [real] Force component weight (direction)
fit:force_wgt_f     0                   # [real] Force component weight (free)
fit:force_wgt_p     1.0                 # [real] Force component weight (projected)

# ===== Regularization [both] =====
fit:weight_L1       1e-12               # [real] L1 regularization weight
fit:weight_L2       1e-8                # [real] L2 regularization weight
fit:weight_rad_w0   1e-6                # [real] Radial basis weight (w0)
fit:weight_rad_w1   1e-8                # [real] Radial basis weight (w1)
fit:weight_rad_w2   1e-10               # [real] Radial basis weight (w2)
fit:radial_reg_type 0                   # [int] Radial regularization type
fit:safe_fit        false               # [bool] [mtp] Use safe (but slower) linear fitting

# ===== Random Initialization [both] =====
fit:random_init     true                # [bool] Randomize coefficients before fitting
fit:force_randomlinear false             # [bool] Force random linear coefficient init
fit:force_randomradial false             # [bool] Force random radial coefficient init
fit:rand_low         -0.1               # [real] Lower bound for random coefficients
fit:rand_up          0.1                # [real] Upper bound for random coefficients
fit:skip_preinit     true               # [bool] Skip pre-initialization
fit:pre_init_iter   0                   # [int] Pre-initialization iterations

# ===== Linear Fit [mtp] =====
fit:lfit_eng_only   false               # [bool] Linear fit energy only
fit:lfit_fastalgo   false               # [bool] Use fast linear fitting algorithm
fit:linear_fit_bfgs false               # [bool] Linear refit at iterations 25, 100, 200 and at training end (ALGLIB)

# ===== Ladder [mtp] =====
fit:do_ladder       false               # [bool] Do ladder training
fit:ladder_cut      0                   # [real] Ladder cutoff
fit:ladder_last     0                   # [int] Last ladder step

# ===== SGD Optimizer [both] =====
fit:learning_rate   1e-3                # [real] SGD learning rate
fit:momentum        0.9                 # [real] SGD momentum
fit:batch_size      80                  # [int] SGD batch size
fit:epoch_limit     200                 # [int] SGD max epochs
fit:lr_scheduler    constant            # [string] LR scheduler: constant, decay, warmup
fit:lr_decay_rate   0.95                # [real] LR decay rate
fit:lr_decay_steps  100                 # [int] LR decay step interval
fit:lr_final        1e-5                # [real] Final LR after decay
fit:clip_gradient   0                   # [real] Gradient clipping threshold (0=disabled)
fit:lr_warmup_steps 0                   # [int] LR warmup steps
fit:lr_warmup_init  1e-6                # [real] Initial LR for warmup
fit:apply_disp      false               # [bool] Apply displacement to training data
fit:disp_sigma      0.01                # [real] Displacement sigma

# ===== L-BFGS Optimizer [both] =====
fit:bfgs_m           15                 # [int] BFGS history length
fit:bfgs_conv_tol    1e-16              # [real] BFGS convergence tol. (function change)
fit:bfgs_grad_tol    1e-16              # [real] BFGS gradient tolerance
fit:bfgs_step_tol    1e-16              # [real] BFGS step tolerance
fit:bfgs_maxiteration 50000             # [int] BFGS max iterations
fit:bfgs_rescale     false              # [bool] [mtp] BFGS rescale
fit:save_every       2                  # [int] Save checkpoint every N iterations


# ===== LBFGSpp Parameters [mtp] =====
fit:lbfgspp:epsilon       1e-6          # [real] Gradient tolerance
fit:lbfgspp:epsgmax       0             # [real] Max gradient tolerance
fit:lbfgspp:epsrel        0             # [real] Relative gradient tolerance
fit:lbfgspp:m             15            # [int] History size
fit:lbfgspp:damping       0             # [real] Damping parameter
fit:lbfgspp:init_step     0             # [real] Initial step
fit:lbfgspp:first_step    0             # [real] First step
fit:lbfgspp:past          0             # [int] Past steps for convergence
fit:lbfgspp:delta         1e-6          # [real] Delta for convergence
fit:lbfgspp:maxit         50000         # [int] Max iterations
fit:lbfgspp:linesearch    0             # [int] Linesearch algorithm
fit:lbfgspp:max_linesearch 50           # [int] Max linesearch steps
fit:lbfgspp:min_step      1e-10         # [real] Min step
fit:lbfgspp:max_step      1e10          # [real] Max step
fit:lbfgspp:ftol          1e-4          # [real] Function tolerance
fit:lbfgspp:wolfe         0.9           # [real] Wolfe condition parameter
fit:lbfgspp:f_dec_coeff   1e-4          # [real] Function decrease coefficient
fit:lbfgspp:s_curv_coeff  0.9           # [real] Curvature condition coefficient
fit:lbfgspp:cautious_factor 1e-6        # [real] Cautious update factor
fit:lbfgspp:max_move      0              # [real] Max parameter move

# ===== Fit Control [mtp] =====
fit:fix_linear_coeffs   false            # [bool] Fix linear coefficients during training
fit:fix_species_coeffs  false            # [bool] Fix species coefficients
fit:fix_radial_coeffs   false            # [bool] Fix radial coefficients
fit:do_orthogonalization true            # [bool] Orthogonalize linear system
fit:precondition        false            # [bool] Use preconditioning
fit:set_scale           false            # [bool] Set variable scaling
fit:save_to             fit.mtp          # [string] Save trained potential to this file

# ===== Nonlinear Training (trainnlpot only) =====
# For nonlinear potential training, popsize controls DE population size
fit:popsize            50               # [int] Population size (DE optimizer)
