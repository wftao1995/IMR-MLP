# smooth-traj — Smooth trajectories (FFT low-pass filter)
# Usage: imrmlp smooth_traj smooth-traj.ini
#
# ===== Input/Output =====
input               trajectory.xyz      # [string] Input trajectory file
output              smoothed.xyz        # [string] Output trajectory file
input-format        extxyz              # [string] Input format
output-format       extxyz              # [string] Output format
index               index.map           # [string] Index file

# ===== Filter =====
timestep            1.0                 # [real] Timestep (fs)
freq-cutoff         5e12                # [real] Cutoff frequency (Hz)
output-rate         1                   # [int] Output every N frames

# ===== Options =====
scale-cell          false               # [bool] Scale cell to average
overwrite           false               # [bool] Overwrite output
