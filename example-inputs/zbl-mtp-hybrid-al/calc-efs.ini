# MTP + ZBL short-range correction for the unary Al example.
# Run this file from its directory; see README.md.

# ===== Input/Output =====
input               POSCAR
output              output-efs.cfg
input-format        POSCAR
output-format       cfg
index               index.map

# ===== Potential =====
# potential_wrapper has its own type-map setting.
pot:typemap         index.map
pot:pottype         hybrid
pot:npot            2
pot:spcount         1

# ===== ZBL Component =====
# Atomic numbers follow the order in index.map.  ZBL is fully active below
# r0, smoothly switched off between r0 and r1, and zero at/above r1.
pot:pot1:pottype    zbl
pot:pot1:z          13
pot:pot1:r0         1.0
pot:pot1:r1         2.0

# ===== MTP Component =====
# The MLIP remains active; train the hybrid if its fitting domain overlaps
# the ZBL transition interval.
pot:pot2:pottype    mtp
pot:pot2:potfile    potential.mtp

# ===== Output Control =====
no-site-energy      false
energy-only         false
show-progress       false
