# calc-efs — Calculate energy, forces, and stress tensors
# Usage: imrmlp calc_efs --settings calc-efs.ini --input POSCAR --output output-efs.cfg
#
# ===== Input/Output =====
input               POSCAR              # [string] Input structure file
output              output-efs.cfg      # [string] Output structure file
input-format        POSCAR              # [string] Input file format
output-format       cfg                 # [string] Output file format
index               index.map           # [string] Index file

# ===== Potential =====
pot:potfile         potential.mtp       # [string] Potential file
pot:pottype         mtp                # [string] Potential type

# ===== Output Control =====
no-site-energy      false               # [bool] Exclude site energy from output
energy-only         false               # [bool] Output energy only (skip forces/stress)
show-progress       false               # [bool] Report completed structure counts
