# pot2table — Export potential as tabulated interaction tables
# Usage: imrmlp pot2table --settings pot2table.ini --pair --index index.map --nr 1000
# MTP is many-body: the pair table samples dimers and is not an equivalent MTP.
#
pot:potfile         potential.mtp       # [string] Potential file
pot:pottype         mtp                 # [string] Potential type
# This settings file supplies only pot: keys. Export flags, index and grid
# options must be passed on the command line; see imrmlp pot2table --help.
