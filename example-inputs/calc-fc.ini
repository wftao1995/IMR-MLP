# calc-fc — Calculate and export force constants
# Usage: imrmlp calc_fc --settings calc-fc.ini --potfile potential.mtp --input POSCAR
#
# ===== Input/Output =====
input               POSCAR              # [string] Structure file
input-format        POSCAR              # [string] Input structure format
index               index.map           # [string] Index file
supercell           2 2 2               # [intvec] Supercell dimensions

# ===== Potential =====
potfile             potential.mtp       # [string] Potential file

# ===== Force Constants =====
write-force-constant true               # [bool] Write FORCE_CONSTANT file
reduced             true                # [bool] Symmetry-reduced output
check-symm          false               # [bool] Check symmetry
symprec             1e-4                # [real] Symmetry tolerance

# ===== Hessian =====
hessian-method      analytic            # analytic, auto, force_fd, energy_fd, hybrid
hessian-nudge-pos   0.001               # [real] finite-difference displacement (A)
hessian-cutoff      0                   # [real] <=0 uses the potential cutoff
