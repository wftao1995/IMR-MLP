# dimer (simple) — Minimal dimer configuration
# Usage: imrmlp dimer dimer-simple.ini
#
# ===== Input/Output =====
structure           POSCAR              # [string] Input structure (initial guess for TS)
input-format        POSCAR              # [string] Input format
index               index.map           # [string] Index file
output              CONTCAR             # [string] Output saddle point

# ===== Potential =====
pot:potfile         potential.mtp       # [string] Potential file
pot:pottype         mtp                 # [string] Potential type

# ===== Dimer =====
dimer:ddr           5e-3                # [real] Dimer separation
dimer:maxiteration  1000                # [int] Max outer iterations
dimer:gtol          1e-2                # [real] Force convergence tolerance
dimer:rot_driver    fire                # [string] Rotation optimizer
dimer:trn_driver    fire                # [string] Translation optimizer

# Reproducible initialization when no MODECAR is specified.
dimer:random_seed   0
