# modefollowing — Mode following algorithm
# Usage: imrmlp modefollowing modefollowing.ini
#
input               POSCAR              # [string] Input structure file
input-format        POSCAR              # [string] Input format
index               index.map           # [string] Index file
potfile             pot.mtp             # [string] Potential file
mode                1                   # [int] Mode type
imode               0                   # [int] Which mode to follow
amplitude           0.1                 # [real] Amplitude
trial-step          0.01                # [real] Trial step size
next-tol            0.1                 # [real] Next step tolerance
car-rep             false               # [bool] Use Cartesian coordinates
nocell              false               # [bool] Skip cell Hessian
request-efs         false               # [bool] Request EFS calculation
hessian                                 # [string] Load Hessian from file
linetraj            false               # [bool] Linear trajectory
symprec             1e-4                # [real] Symmetry tolerance
pressure            0                   # [real] External pressure (GPa)
modecar-out                             # [string] MODECAR output file
relax:driver        fire               # [string] Relaxation driver
relax:maxiteration  1000                # [int] Max iterations
