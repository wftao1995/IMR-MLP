# select — MaxVol active set selection
# Usage: imrmlp maxvol_select select.ini    # Build active set
#        imrmlp maxvol_sample select.ini    # Grade structures
#        imrmlp maxvol_extend select.ini # Expand active set
#
pool                pool.xyz            # [string] Input structure pool
input               POSCAR              # [string] Input configuration (sample/add mode)
output              selected.xyz        # [string] Output selected structures
index               index.map           # [string] Index map file
input-format        extxyz              # [string] Input format
output-format       extxyz              # [string] Output format
score-file                              # [string] Output per-structure scores
state-file                              # [string] Active-set state file (for sample/add)
train               train.xyz           # [string] Training set (select_add mode)
candidates          candidates.xyz      # [string] Candidates (select_add mode)

builder:dtype       mtm                 # [string] Descriptor type: mtm, pot_efs, behler, bondorder
builder:potfile     pot.mtp             # [string] Potential file
builder:mode        nbh                 # [string] Row mode: nbh (per-atom), cfg (per-structure)
builder:all-coeffs  false               # [bool] Use ALL coefficients (vs linear only)
builder:row-scaling uniform             # [string] uniform (legacy) or mlip (force/site omit N scaling)
builder:w-energy    1.0                 # [real] Energy weight (pot_efs mode)
builder:w-site      0                   # [real] Site-energy weight
builder:w-force     0                   # [real] Force weight
builder:w-stress    0                   # [real] Stress weight

selector:threshold  1.001               # [real] Selection threshold
selector:weight     1.0                 # [real] B-matrix row weight
selector:pow-scale  0.5                 # [real] natoms scaling power
selector:init-mode  auto                # [string] auto, mlip (virtual identity), or data (legacy)
selector:init-value 1e-6                # [real] MLIP-compatible virtual identity scale
selector:max-swaps  0                   # [int] Swap limit (0=unlimited)
selector:verbose    false               # [bool] Verbose output
selector:select-mode stream             # [string] stream, full, or online (incremental state updates)
selector:stream-mode exact              # [string] exact or fast shortlist mode
selector:stream-chunk-size 32           # [int] Configurations per parallel build/cache chunk
selector:stream-fast-passes 2           # [int] Maximum shortlist passes in fast mode
selector:stream-fast-shortlist 0        # [int] Global shortlist size (0=automatic)
selector:stream-cache-mode auto         # [string] auto, memory, mmap, or off (legacy)
selector:stream-memory-limit-mb 3072    # [int] Per-process resident cache limit
selector:stream-cache-dir               # [string] mmap directory (empty uses TMPDIR or /tmp)
