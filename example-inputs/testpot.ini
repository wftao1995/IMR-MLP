# testpot — Test potential by checking forces via finite difference
# Usage: imrmlp testpot testpot.ini
#
input               POSCAR              # [string] Input structure file
format              POSCAR              # [string] Input format
index               index.map           # [string] Index file
pot:potfile         potential.mtp       # [string] Potential file
test-which          -1                  # [int] Which atom to test (-1 = auto)
nugedvalue          0.001               # [real] Finite difference step
