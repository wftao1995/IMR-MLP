# Minimal fixed-cell CI-NEB
# Replace model/structure paths and check species mapping.
# Workflow: docs/guides/neb.md
# Exit codes: 0 converged, 2 unconverged, 1 error.

# ===== Input/Output =====
index               index.map

# ===== Potential =====
pot:potfile         model.mtp

# ===== Parallel =====
num_threads         1

# ===== Images =====
nimgs               7
image:0             initial.vasp
image:6             final.vasp

# ===== Optimizer =====
driver              fire
max_move            0.05

# ===== Convergence =====
gtol                0.02
maxiteration        500

# ===== NEB =====
neb:solver_policy   stable-v1
neb:init_method     idpp
neb:spring          1
neb:climb           true
