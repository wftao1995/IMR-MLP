# Moment-tensor topology generation. Keys are top-level, without a prefix.
# Run in a fresh directory: imrmlp mtmbasis --settings mtmbasis.ini
# This command does not read an atomic structure.

# ===== Topology =====
max_lev             8
max_dim             2
max_mu              2
max_nv              2
mu_wei              2
nv_wei              1
dim_wei             2

# ===== Search =====
# Contraction-layout search (not model fitting).
mode                3
seed                17
maxiter             100
randominit          false
restart             false
w1                  1
w2                  4

# --generate-only writes alphapool.dat and exits without a model topology.
# --alphapool alphapool.dat reads an existing pool instead of enumeration.
# --moments FILE reads a count followed by that many mu/nu pairs, not inline pairs.
# potential.mtp_0 still needs species/radial settings and fitted coefficients.
# For a complete basis/fit/validation workflow: examples/mtp-workflow/README.md
