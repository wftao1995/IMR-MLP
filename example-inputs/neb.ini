# neb — Nudged Elastic Band calculation
# Usage: imrmlp neb neb.ini
# Full parameter reference; start with neb-simple.ini and docs/guides/neb.md.
#
# ===== Input/Output =====
input-format        POSCAR              # [string] Input structure format
index               index.map           # [string] Index file mapping atom types to indices
mepout              mep.xyz             # [string] MEP output file
mepformat           extxyz              # [string] MEP output format
summary             neb.dat             # [string] Summary output file

# ===== Potential =====
pot:potfile         potential.mtp       # [string] Potential parameter file
pot:pottype         mtp                 # [string] Potential type

# ===== Parallel =====
num_threads         8                   # [int] OpenMP threads per rank; keep it at or below physical cores

# ===== Images =====
nimgs               7                   # [int] Number of images (including endpoints)
image:0             CONTCAR-INI         # [string] Initial endpoint structure
image:6             CONTCAR-FIN         # [string] Final endpoint structure

# ===== Optimizer =====
driver              fire                # [string] Optimizer: fire (default) or lbfgs
max_move            0.001               # [real] Max step per iteration
lbfgs_m             10                  # [int] BFGS history length
first_step          0.001               # [real] Initial step size
s_curv_coeff        0.8                 # [real] DO NOT CHANGE
damping             0.0                 # [real] Damping parameter

# ===== Convergence =====
neb:neb_ftol        1e-2                # [real] Convergence tol. on complete active NEB residual
neb:gtol            1e-2                # [real] Alias for neb_ftol
neb:check_saddle    false               # [bool] Deprecated compatibility key; CI uses full NEB-force convergence
maxiteration        200                 # [int] Max NEB iterations

# ===== NEB =====
neb:spring          1                   # [real] Spring constant
neb:climb           true                # [bool] Enable CI-NEB (Climbing Image)
neb:climb_mode      highest             # [string] highest (standard) or all_local
neb:climb_delay     0                   # [int] Delay: accepted steps in stable-v1, force evaluations in legacy
neb:vally           true                # [bool] Enable valley image detection
neb:pin             true                # [bool] Pin climbing/vally images
#neb:ciival                             # [string] CI-NEB internal parameter (parsed to array)
neb:check_mic       true                # [bool] Minimum-image unwrapping; verify the intended periodic branch
neb:nblocks         10                  # [int] Output interval (force evaluations)

# ===== Path Initialization =====
neb:init_method     linear              # [string] Path init: linear or idpp
neb:idpp_fmax       1e-3                # [real] IDPP force convergence threshold
neb:idpp_max_steps  1000                # [int] IDPP max optimization steps

# ===== Variable Cell =====
neb:vcneb           false               # [bool] Enable VC-NEB (variable cell)
neb:pressure        0                   # [real] External pressure (GPa)
neb:symm_strain     true                # [bool] Use symmetric strain tensor
#neb:apply_scal                         # [bool] Scaling parameter for vc+symm_strain
neb:iref            -2                  # [int] Reference cell: -2=average, -1=final
#neb:cmask                              # [string] Cell parameter mask (9 components)
neb:selective_dynamics false            # [bool] Enable selective dynamics

# ===== Variable Spring =====
neb:variablespring  false               # [bool] Variable spring constants
neb:springmax       1                   # [real] Max spring constant
neb:springmin       1                   # [real] Min spring constant

# ===== Variable Images =====
neb:variableimage   false               # [bool] Auto-insert/remove images
neb:max_images      20                  # [int] Max image count
neb:min_images      5                   # [int] Min total image count (including endpoints)
neb:img_insert_thresh 2.0               # [real] Insert when segment > thresh × avg
neb:img_remove_thresh 0.3               # [real] Remove when segment < thresh × avg
neb:img_adjust_interval 10              # [int] Check spacing every N steps

# ===== Minimum Distance =====
neb:apply_mindist   false               # [bool] Apply minimum distance constraint
neb:mdist_r         1.0                 # [real] Cutoff for minimum distance check
neb:mdist_factor    1.0                 # [real] Factor for mindist
neb:mdist_power     1.0                 # [real] Power for mindist

# ===== Trajectory =====
neb:write_traj      false               # [bool] Write optimization trajectory
neb:traj            nebtrj.xyz          # [string] Trajectory output file
neb:traj-format     extxyz              # [string] Trajectory output format

# ===== Advanced =====
#neb:ttype                              # [int] Tangent type
#neb:stype                              # [int] Spring projection type
neb:debug           0                   # [int] Debug level
